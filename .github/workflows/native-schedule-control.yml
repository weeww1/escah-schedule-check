name: Native schedule repository control

on:
  push:
    paths:
      - .github/workflows/native-schedule-control.yml
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

# Only used to stop this diagnostic after its first genuine scheduled run.
permissions:
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record delivery and stop after the first native schedule event
        env:
          GH_TOKEN: ${{ github.token }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          event = os.environ['GITHUB_EVENT_NAME']
          print(json.dumps({'event': event, 'cron': os.environ.get('CRON_EXPRESSION'),
                            'utc': dt.datetime.now(dt.timezone.utc).isoformat()}), flush=True)
          if event == 'schedule':
              repo = os.environ['GITHUB_REPOSITORY']
              assert repo in {'weeww1/escah', 'weeww1/escah-schedule-check'}
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      return None
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/actions/workflows/native-schedule-control.yml/disable',
                  data=b'', method='PUT', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                      'User-Agent': 'native-schedule-repository-control'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                  assert response.status == 204
              print('Stopped this diagnostic after confirmed native schedule delivery.', flush=True)
          PY
